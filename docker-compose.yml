services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hr_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_search"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hr_search
      RATE_LIMIT_RPM: "120"
      RATE_LIMIT_BURST: "60"
      ADMIN_API_KEY: "admin"
      API_KEYS_JSON: '{"demo-org-1":1,"demo-org-2":2}'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
